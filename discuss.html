<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>竹林茶會 · 永遠亭 医療報告</title>
  <meta name="description" content="永遠亭医療報告的讀者討論區：公告與匿名留言板。">
  <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121719" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/icon.svg?v=20261107c" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/style.css?v=20261107c">
</head>
<body>

<div class="wrap wrap-narrow">

  <header class="masthead">
    <span class="crest">永遠亭</span>
    <h1>竹林茶會</h1>
    <p class="masthead-en">Bamboo Grove Salon</p>
    <div class="masthead-rule"><span>公告 · 留言</span></div>
  </header>

  <section class="foreword">
    <div>
      <p>有話想說，便去說。公告由我發，留言由你寫。</p>
      <cite>—— 八意永琳</cite>
    </div>
  </section>

  <section class="board-notices" aria-labelledby="noticeTitle">
    <header class="board-head">
      <h2 id="noticeTitle">公告</h2>
      <a class="tool-btn" href="https://github.com/Kasilovsky/eirin-report/issues" target="_blank" rel="noopener">GitHub 議題 ↗</a>
    </header>
    <ul class="notice-list" id="noticeList">
      <li class="loading">正在調閱公告…</li>
    </ul>
  </section>

  <section class="board-chat" aria-labelledby="chatTitle">
    <header class="board-head">
      <h2 id="chatTitle">留言板</h2>
      <button class="tool-btn" id="chatToggle" type="button" aria-expanded="false" aria-controls="chatBody">展開</button>
    </header>

    <div class="chat-body" id="chatBody" hidden>
      <div class="chat-auth" id="chatAuth">
        <div class="auth-tabs">
          <button type="button" data-auth="login" aria-pressed="true">登入</button>
          <button type="button" data-auth="register" aria-pressed="false">註冊</button>
        </div>
        <div class="auth-row">
          <input id="authName" type="text" placeholder="名字（2–24 字）" autocomplete="username" spellcheck="false">
          <input id="authSecret" type="password" placeholder="密碼（至少 8 位）" autocomplete="current-password">
        </div>
        <button class="tool-btn" id="authSubmit" type="button">登入</button>
        <p class="auth-hint" id="authHint">首次使用請先切到「註冊」。名字與密碼只保存在本機瀏覽器，不上傳伺服器；清快取或換裝置會遺失。</p>
      </div>

      <div class="chat-compose" id="chatCompose" hidden>
        <div class="compose-top">
          <span>以 <strong id="chatWho">——</strong> 的身份發言</span>
          <button class="link-btn" id="chatLogout" type="button">登出</button>
        </div>
        <textarea id="chatInput" maxlength="500" placeholder="說點什麼…（500 字以內）"></textarea>
        <div class="compose-bottom">
          <span id="chatCount">0 / 500</span>
          <button class="tool-btn" id="chatSend" type="button">發送</button>
        </div>
      </div>

      <ul class="chat-list" id="chatList">
        <li class="loading">正在調閱留言…</li>
      </ul>
    </div>
  </section>

  <footer class="colophon">
    <div class="row">
      <span><a href="./">← 返回医療報告</a> · <a href="digest.html">本期要目</a></span>
      <span>公告寄存於 GitHub Issues；留言保存在本機瀏覽器（localStorage），不上傳。</span>
    </div>
    <div class="seal">永遠亭 医療部 · 八意永琳</div>
  </footer>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/discuss.js?v=20261107c" defer></script>
</body>
</html>
