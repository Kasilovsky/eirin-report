<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>竹林茶會 · 永遠亭 医療報告</title>
  <meta name="description" content="永遠亭医療報告的讀者討論索引：議題寄存於 GitHub Issues，發言需以 GitHub 帳號登入，全程由 GitHub 保存。">
  <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121719" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="wrap wrap-narrow">

  <header class="masthead">
    <span class="crest">永遠亭</span>
    <h1>竹林茶會</h1>
    <p class="masthead-en">Bamboo Grove Salon</p>
    <div class="masthead-rule"><span>讀者討論 · 議題寄存於 GitHub</span></div>
  </header>

  <section class="foreword">
    <div>
      <p>有話想說，便去說。議題與回覆由 GitHub 保管，這裡只做索引。</p>
      <cite>—— 八意永琳</cite>
    </div>
  </section>

  <div class="thread-toolbar">
    <a class="tool-btn" id="newThread" href="#" target="_blank" rel="noopener">＋ 發起新議題</a>
    <button class="tool-btn" id="refresh" type="button">↻ 重新整理</button>
  </div>

  <p class="thread-note">
    發言需要 GitHub 帳號，議題與回覆都會公開保存在
    <a href="https://github.com/Kasilovsky/eirin-report/issues" target="_blank" rel="noopener">倉庫 Issues</a>。
    本站不收集、不保存任何憑證。
  </p>

  <main>
    <ul class="thread-list" id="threads" aria-live="polite">
      <li class="loading">正在調閱議題…</li>
    </ul>
  </main>

  <footer class="colophon">
    <div class="row">
      <span><a href="./">← 返回医療報告</a></span>
      <span>議題寄存：<a href="https://github.com/Kasilovsky/eirin-report/issues" target="_blank" rel="noopener">GitHub Issues</a></span>
    </div>
    <div class="seal">永遠亭 医療部 · 八意永琳</div>
  </footer>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/discuss.js" defer></script>
</body>
</html>
