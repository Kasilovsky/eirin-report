<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竹林茶會 · 討論板</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: #f5f0e7; color: #3e3232;
            max-width: 600px; margin: 0 auto; padding: 20px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #4a3620; }
        .action-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .toggle-btn {
            background: #1e3a5f; color: white; border: none;
            padding: 10px 20px; border-radius: 8px; font-size: 1em; cursor: pointer;
        }
        .refresh-btn {
            background: #e0d7c6; border: none; padding: 10px 16px;
            border-radius: 8px; cursor: pointer; font-size: 0.9em;
        }

        .compose-box {
            background: white; border-radius: 8px; padding: 16px; margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: none;
        }
        .compose-box.show { display: block; }
        .compose-box input, .compose-box textarea {
            width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc;
            border-radius: 6px; font-family: inherit; font-size: 0.95em;
        }
        .compose-box textarea { height: 120px; resize: vertical; }
        .token-row {
            display: flex; gap: 8px; align-items: center; margin-bottom: 4px;
        }
        .token-row input { flex: 1; margin-bottom: 0; }
        .submit-btn {
            background: #b91c1c; color: white; border: none; padding: 8px 20px;
            border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .note {
            font-size: 0.75em; color: #8b7b6b; margin-top: 8px;
        }

        .issue-card {
            background: white; border-radius: 8px; padding: 16px; margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .issue-header {
            display: flex; justify-content: space-between; align-items: baseline;
        }
        .issue-title {
            font-weight: bold; color: #2f2418; cursor: pointer;
            flex: 1; margin-right: 10px;
        }
        .issue-meta { font-size: 0.8em; color: #6b5b4b; margin-bottom: 8px; }
        .comment-badge {
            background: #e0d7c6; padding: 2px 10px; border-radius: 20px;
            font-size: 0.8em; cursor: pointer; white-space: nowrap;
        }
        .comment-badge:hover { background: #d0c0a0; }

        .comments-section {
            margin-top: 12px; border-top: 1px solid #e0d7c6; padding-top: 12px;
            display: none;
        }
        .comments-section.show { display: block; }
        .comment-item {
            background: #f9f6f0; padding: 10px; margin-bottom: 8px;
            border-radius: 6px;
        }
        .comment-author { font-size: 0.8em; font-weight: bold; color: #4a3620; }
        .comment-time { font-size: 0.75em; color: #8b7b6b; margin-left: 8px; }
        .comment-body { font-size: 0.9em; margin-top: 4px; word-break: break-word; }
        .load-comments {
            font-size: 0.85em; color: #8b7b6b; text-align: center; padding: 10px;
        }

        .reply-box { margin-top: 10px; }
        .reply-box textarea {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;
            font-family: inherit; font-size: 0.9em; resize: vertical;
        }
        .reply-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
        .reply-btn {
            background: #1e3a5f; color: white; border: none;
            padding: 6px 14px; border-radius: 20px; font-size: 0.85em; cursor: pointer;
        }
        .reply-btn:hover { background: #b91c1c; }
        .cancel-reply-btn {
            background: #e0d7c6; border: none; padding: 6px 14px;
            border-radius: 20px; font-size: 0.85em; cursor: pointer;
        }

        .loading { text-align: center; color: #8b7b6b; padding: 40px; }
        .info-text {
            font-size: 0.8em; color: #8b7b6b; text-align: center; margin-top: 8px;
        }
        .github-link {
            font-size: 0.75em; color: #8b7b6b; cursor: pointer; text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎋 竹林茶會</h1>
        <p>永遠亭醫療報告 · 群友討論區</p>
    </div>

    <div class="action-bar">
        <button class="toggle-btn" id="toggleComposeBtn">✚ 發佈新帖</button>
        <button class="refresh-btn" onclick="loadIssues()">🔄 重新整理</button>
    </div>

    <div class="compose-box" id="composeBox">
        <h3 style="margin-bottom:12px;">✏️ 發表新話題</h3>
        <input type="text" id="issueTitle" placeholder="標題">
        <textarea id="issueBody" placeholder="內容（支援 Markdown，可直接拖曳圖片至此）"></textarea>
        <div class="token-row">
            <input type="password" id="tokenInput" placeholder="GitHub Token (只需設定一次)">
            <button class="submit-btn" onclick="submitIssue()">發佈</button>
        </div>
        <div class="note">
            🔑 需要 GitHub 個人存取權杖 (Token) 才能發文。<br>
            <a href="https://github.com/settings/tokens/new?scopes=public_repo&description=eirin-discuss" target="_blank">點此建立 Token</a>（勾選 `public_repo` 權限）。<br>
            Token 會安全儲存在你的瀏覽器中。
        </div>
    </div>

    <div id="issues-container"><div class="loading">🌸 載入討論中...</div></div>

    <div class="info-text">
        💡 點擊帖子標題或 💬 數字即可展開查看回覆，無需離開本頁。
    </div>

    <script>
        const repo = 'Kasilovsky/eirin-report';
        let personalToken = localStorage.getItem('gh_token') || '';

        if (personalToken) {
            document.getElementById('tokenInput').value = personalToken;
        }

        const composeBox = document.getElementById('composeBox');
        const toggleBtn = document.getElementById('toggleComposeBtn');
        toggleBtn.addEventListener('click', () => {
            composeBox.classList.toggle('show');
            if (composeBox.classList.contains('show')) {
                document.getElementById('issueTitle').focus();
                toggleBtn.textContent = '✖ 取消發帖';
            } else {
                toggleBtn.textContent = '✚ 發佈新帖';
            }
        });

        // 储存每个 issue 的评论数据以及展开状态
        const commentsCache = {};

        async function submitIssue() {
            const title = document.getElementById('issueTitle').value.trim();
            const body = document.getElementById('issueBody').value.trim();
            const token = document.getElementById('tokenInput').value.trim();

            if (!title || !body) return alert('請填寫標題和內容');
            if (!token) return alert('請貼上你的 GitHub Token');

            const res = await fetch(`https://api.github.com/repos/${repo}/issues`, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title, body })
            });

            if (res.ok) {
                alert('✅ 發佈成功！');
                localStorage.setItem('gh_token', token);
                document.getElementById('issueTitle').value = '';
                document.getElementById('issueBody').value = '';
                composeBox.classList.remove('show');
                toggleBtn.textContent = '✚ 發佈新帖';
                loadIssues();
            } else {
                const err = await res.json();
                alert('❌ 發佈失敗: ' + err.message);
            }
        }

        function loadIssues() {
            const container = document.getElementById('issues-container');
            container.innerHTML = '<div class="loading">🌸 載入中...</div>';

            fetch(`https://api.github.com/repos/${repo}/issues?state=all&per_page=30&sort=created&direction=desc`)
                .then(res => {
                    if (!res.ok) throw new Error('無法讀取討論');
                    return res.json();
                })
                .then(issues => {
                    if (!issues.length) {
                        container.innerHTML = '<div class="loading">🌿 暫無討論，來發第一帖吧！</div>';
                        return;
                    }
                    container.innerHTML = issues.map(issue => {
                        const number = issue.number;
                        const commentCount = issue.comments || 0;
                        return `
                        <div class="issue-card" id="issue-${number}">
                            <div class="issue-header">
                                <span class="issue-title" onclick="toggleComments(${number})">${escapeHtml(issue.title)}</span>
                                <span class="comment-badge" onclick="toggleComments(${number})">💬 ${commentCount}</span>
                            </div>
                            <div class="issue-meta">
                                #${number} · ${issue.user.login} · ${new Date(issue.created_at).toLocaleDateString()} · ${issue.state === 'open' ? '🟢 開放' : '🔴 已關閉'}
                            </div>
                            <div class="comments-section" id="comments-${number}"></div>
                        </div>`;
                    }).join('');
                })
                .catch(err => {
                    container.innerHTML = `<div class="loading">⚠️ ${err.message}</div>`;
                });
        }

        // 切换评论显示
        async function toggleComments(issueNumber) {
            const commentsDiv = document.getElementById(`comments-${issueNumber}`);
            if (!commentsDiv) return;

            if (commentsDiv.classList.contains('show')) {
                commentsDiv.classList.remove('show');
                return;
            }

            // 显示加载中
            commentsDiv.innerHTML = '<div class="load-comments">🌸 載入回覆中...</div>';
            commentsDiv.classList.add('show');

            if (commentsCache[issueNumber]) {
                // 直接渲染缓存
                renderComments(issueNumber, commentsCache[issueNumber]);
            } else {
                // 从 API 获取评论
                try {
                    const res = await fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}/comments`);
                    if (!res.ok) throw new Error('無法載入回覆');
                    const comments = await res.json();
                    commentsCache[issueNumber] = comments;
                    renderComments(issueNumber, comments);
                } catch (err) {
                    commentsDiv.innerHTML = `<div class="load-comments">⚠️ ${err.message}</div>`;
                }
            }
        }

        // 渲染评论列表和回复框
        function renderComments(issueNumber, comments) {
            const commentsDiv = document.getElementById(`comments-${issueNumber}`);
            if (!commentsDiv) return;

            let html = '';
            if (comments.length === 0) {
                html = '<div class="load-comments">🌿 尚無回覆</div>';
            } else {
                html = comments.map(c => `
                    <div class="comment-item">
                        <div>
                            <span class="comment-author">${escapeHtml(c.user.login)}</span>
                            <span class="comment-time">${new Date(c.created_at).toLocaleString()}</span>
                        </div>
                        <div class="comment-body">${escapeHtml(c.body)}</div>
                    </div>
                `).join('');
            }

            // 回复输入框
            html += `
                <div class="reply-box">
                    <textarea id="reply-text-${issueNumber}" placeholder="輸入你的回覆..." rows="2"></textarea>
                    <div class="reply-actions">
                        <button class="reply-btn" onclick="submitReply(${issueNumber})">送出回覆</button>
                    </div>
                    <div class="note">🔑 回覆需使用 Token，若未設定請先在上方發帖區設定一次。</div>
                </div>
            `;

            commentsDiv.innerHTML = html;
        }

        async function submitReply(issueNumber) {
            const token = personalToken || document.getElementById('tokenInput').value.trim();
            if (!token) {
                alert('請先設定你的 GitHub Token（可在發帖區輸入並儲存）。');
                return;
            }
            const body = document.getElementById(`reply-text-${issueNumber}`).value.trim();
            if (!body) return alert('請輸入回覆內容');

            const res = await fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}/comments`, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ body })
            });

            if (res.ok) {
                // 清除缓存，重新加载评论
                delete commentsCache[issueNumber];
                // 重新加载该 issue 的评论
                const commentsDiv = document.getElementById(`comments-${issueNumber}`);
                if (commentsDiv && commentsDiv.classList.contains('show')) {
                    toggleComments(issueNumber); // 先关闭再打开会重新加载
                    // 简单刷新：先关闭再打开
                    commentsDiv.classList.remove('show');
                    setTimeout(() => toggleComments(issueNumber), 50);
                }
                // 更新评论数（因为 GitHub 不会立即返回，我们手动 +1）
                const badge = document.querySelector(`#issue-${issueNumber} .comment-badge`);
                if (badge) {
                    const currentCount = parseInt(badge.textContent.replace('💬 ', '')) || 0;
                    badge.textContent = `💬 ${currentCount + 1}`;
                }
            } else {
                const err = await res.json();
                alert('❌ 回覆失敗: ' + err.message);
            }
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
        }

        // 初始化
        loadIssues();
    </script>
</body>
</html>
