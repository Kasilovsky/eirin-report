<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竹林茶會 · 討論板</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: #f5f0e7; color: #3e3232;
            max-width: 600px; margin: 0 auto; padding: 20px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #4a3620; }
        .action-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .toggle-btn {
            background: #1e3a5f; color: white; border: none;
            padding: 10px 20px; border-radius: 8px; font-size: 1em; cursor: pointer;
        }
        .refresh-btn {
            background: #e0d7c6; border: none; padding: 10px 16px;
            border-radius: 8px; cursor: pointer; font-size: 0.9em;
        }

        .compose-box {
            background: white; border-radius: 8px; padding: 16px; margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: none;
        }
        .compose-box.show { display: block; }
        .compose-box input, .compose-box textarea {
            width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc;
            border-radius: 6px; font-family: inherit; font-size: 0.95em;
        }
        .compose-box textarea { height: 120px; resize: vertical; }
        .token-row {
            display: flex; gap: 8px; align-items: center; margin-bottom: 4px;
        }
        .token-row input { flex: 1; margin-bottom: 0; }
        .submit-btn {
            background: #b91c1c; color: white; border: none; padding: 8px 20px;
            border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .note {
            font-size: 0.75em; color: #8b7b6b; margin-top: 8px;
        }

        .issue-card {
            background: white; border-radius: 8px; padding: 16px; margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            transition: box-shadow 0.2s;
        }
        .issue-title { font-weight: bold; margin-bottom: 4px; color: #2f2418; }
        .issue-meta { font-size: 0.8em; color: #6b5b4b; margin-bottom: 8px; }
        .reply-area { margin-top: 12px; display: none; }
        .reply-area.show { display: block; }
        .reply-area textarea {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;
            font-family: inherit; font-size: 0.9em; resize: vertical; margin-bottom: 8px;
        }
        .reply-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .reply-btn {
            background: #1e3a5f; color: white; border: none;
            padding: 6px 14px; border-radius: 20px; font-size: 0.85em; cursor: pointer;
        }
        .reply-btn:hover { background: #b91c1c; }
        .cancel-reply-btn {
            background: #e0d7c6; border: none; padding: 6px 14px;
            border-radius: 20px; font-size: 0.85em; cursor: pointer;
        }
        .loading { text-align: center; color: #8b7b6b; padding: 40px; }
        .info-text {
            font-size: 0.8em; color: #8b7b6b; text-align: center; margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎋 竹林茶會</h1>
        <p>永遠亭醫療報告 · 群友討論區</p>
    </div>

    <div class="action-bar">
        <button class="toggle-btn" id="toggleComposeBtn">✚ 發佈新帖</button>
        <button class="refresh-btn" onclick="loadIssues()">🔄 重新整理</button>
    </div>

    <div class="compose-box" id="composeBox">
        <h3 style="margin-bottom:12px;">✏️ 發表新話題</h3>
        <input type="text" id="issueTitle" placeholder="標題">
        <textarea id="issueBody" placeholder="內容（支援 Markdown，可直接拖曳圖片至此）"></textarea>
        <div class="token-row">
            <input type="password" id="tokenInput" placeholder="GitHub Token (只需設定一次)">
            <button class="submit-btn" onclick="submitIssue()">發佈</button>
        </div>
        <div class="note">
            🔑 需要 GitHub 個人存取權杖 (Token) 才能發文。<br>
            <a href="https://github.com/settings/tokens/new?scopes=public_repo&description=eirin-discuss" target="_blank">點此建立 Token</a>（勾選 `public_repo` 權限）。<br>
            Token 會安全儲存在你的瀏覽器中。
        </div>
    </div>

    <div id="issues-container"><div class="loading">🌸 載入討論中...</div></div>

    <div class="info-text">
        💡 點擊卡片標題可跳轉至 GitHub 查看詳情。使用下方「💬 快速回覆」無需離開本頁。
    </div>

    <script>
        const repo = 'Kasilovsky/eirin-report';
        let personalToken = localStorage.getItem('gh_token') || '';

        if (personalToken) {
            document.getElementById('tokenInput').value = personalToken;
        }

        const composeBox = document.getElementById('composeBox');
        const toggleBtn = document.getElementById('toggleComposeBtn');
        toggleBtn.addEventListener('click', () => {
            composeBox.classList.toggle('show');
            if (composeBox.classList.contains('show')) {
                document.getElementById('issueTitle').focus();
                toggleBtn.textContent = '✖ 取消發帖';
            } else {
                toggleBtn.textContent = '✚ 發佈新帖';
            }
        });

        async function submitIssue() {
            const title = document.getElementById('issueTitle').value.trim();
            const body = document.getElementById('issueBody').value.trim();
            const token = document.getElementById('tokenInput').value.trim();

            if (!title || !body) return alert('請填寫標題和內容');
            if (!token) return alert('請貼上你的 GitHub Token');

            const res = await fetch(`https://api.github.com/repos/${repo}/issues`, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title, body })
            });

            if (res.ok) {
                alert('✅ 發佈成功！');
                localStorage.setItem('gh_token', token);
                document.getElementById('issueTitle').value = '';
                document.getElementById('issueBody').value = '';
                composeBox.classList.remove('show');
                toggleBtn.textContent = '✚ 發佈新帖';
                loadIssues();
            } else {
                const err = await res.json();
                alert('❌ 發佈失敗: ' + err.message);
            }
        }

        function loadIssues() {
            const container = document.getElementById('issues-container');
            container.innerHTML = '<div class="loading">🌸 載入中...</div>';

            fetch(`https://api.github.com/repos/${repo}/issues?state=all&per_page=30&sort=created&direction=desc`)
                .then(res => {
                    if (!res.ok) throw new Error('無法讀取討論');
                    return res.json();
                })
                .then(issues => {
                    if (!issues.length) {
                        container.innerHTML = '<div class="loading">🌿 暫無討論，來發第一帖吧！</div>';
                        return;
                    }
                    container.innerHTML = issues.map(issue => {
                        const issueNumber = issue.number;
                        const htmlUrl = issue.html_url;
                        return `
                        <div class="issue-card">
                            <div class="issue-title" onclick="window.open('${htmlUrl}', '_blank')" style="cursor:pointer; text-decoration:underline;">
                                ${escapeHtml(issue.title)}
                            </div>
                            <div class="issue-meta">
                                #${issueNumber} · ${issue.user.login} · ${new Date(issue.created_at).toLocaleDateString()} · ${issue.state === 'open' ? '🟢 開放' : '🔴 已關閉'}
                            </div>
                            <div class="reply-actions">
                                <button class="reply-btn" onclick="toggleReply(${issueNumber})">💬 快速回覆</button>
                            </div>
                            <div class="reply-area" id="reply-area-${issueNumber}">
                                <textarea id="reply-body-${issueNumber}" placeholder="輸入你的回覆..."></textarea>
                                <div class="reply-actions">
                                    <button class="cancel-reply-btn" onclick="toggleReply(${issueNumber})">取消</button>
                                    <button class="reply-btn" onclick="submitReply(${issueNumber})">送出回覆</button>
                                </div>
                            </div>
                        </div>
                        `;
                    }).join('');
                })
                .catch(err => {
                    container.innerHTML = `<div class="loading">⚠️ ${err.message}</div>`;
                });
        }

        function toggleReply(issueNumber) {
            const area = document.getElementById(`reply-area-${issueNumber}`);
            if (!area) return;
            area.classList.toggle('show');
            if (area.classList.contains('show')) {
                document.getElementById(`reply-body-${issueNumber}`).focus();
            }
        }

        async function submitReply(issueNumber) {
            const token = personalToken || document.getElementById('tokenInput').value.trim();
            if (!token) {
                alert('請先設定你的 GitHub Token。');
                return;
            }
            const body = document.getElementById(`reply-body-${issueNumber}`).value.trim();
            if (!body) return alert('請輸入回覆內容');

            const res = await fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}/comments`, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ body })
            });

            if (res.ok) {
                alert('✅ 回覆成功！');
                document.getElementById(`reply-body-${issueNumber}`).value = '';
                toggleReply(issueNumber); // 收起回复框
            } else {
                const err = await res.json();
                alert('❌ 回覆失敗: ' + err.message);
            }
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
        }

        loadIssues();
    </script>
</body>
</html>
