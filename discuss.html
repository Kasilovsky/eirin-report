
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竹林茶會 · 討論板</title>
    <style>
        body { font-family: 'Segoe UI','Noto Sans SC',sans-serif; background:#f5f0e7; color:#3e3232; max-width:600px; margin:0 auto; padding:20px; }
        .header { text-align:center; margin-bottom:20px; }
        .header h1 { color:#4a3620; }
        .action-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .toggle-btn { background:#1e3a5f; color:white; border:none; padding:10px 20px; border-radius:8px; font-size:1em; cursor:pointer; }
        .refresh-btn { background:#e0d7c6; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; font-size:0.9em; }
        .compose-box { background:white; border-radius:8px; padding:16px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,0.08); display:none; }
        .compose-box.show { display:block; }
        .compose-box input, .compose-box textarea { width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:6px; font-family:inherit; }
        .compose-box textarea { height:120px; resize:vertical; }
        .token-row { display:flex; gap:8px; align-items:center; }
        .token-row input { flex:1; }
        .submit-btn { background:#b91c1c; color:white; border:none; padding:8px 20px; border-radius:6px; cursor:pointer; }
        .note { font-size:0.75em; color:#8b7b6b; margin-top:8px; }
        .issue-card { background:white; border-radius:8px; padding:16px; margin-bottom:12px; box-shadow:0 2px 6px rgba(0,0,0,0.05); }
        .issue-title { font-weight:bold; cursor:pointer; }
        .issue-meta { font-size:0.8em; color:#6b5b4b; }
        .reactions { display:flex; gap:8px; margin:8px 0; align-items:center; }
        .reaction-btn { background:transparent; border:1px solid #ccc; border-radius:16px; padding:2px 10px; cursor:pointer; font-size:0.85em; }
        .comments-section { margin-top:12px; border-top:1px solid #e0d7c6; padding-top:12px; display:none; }
        .comments-section.show { display:block; }
        .comment-item { background:#f9f6f0; padding:10px; margin-bottom:8px; border-radius:6px; }
        .comment-meta { font-size:0.8em; color:#6b5b4b; }
        .reply-box { margin-top:10px; }
        .reply-box textarea { width:100%; padding:8px; border:1px solid #ccc; border-radius:6px; }
        .reply-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
        .loading { text-align:center; color:#8b7b6b; padding:40px; }
    </style>
</head>
<body>
<div class="header"><h1>🎋 竹林茶會</h1><p>永遠亭醫療報告 · 群友討論區</p></div>
<div class="action-bar">
    <button class="toggle-btn" id="toggleComposeBtn">✚ 發佈新帖</button>
    <button class="refresh-btn" onclick="loadIssues()">🔄 重新整理</button>
</div>
<div class="compose-box" id="composeBox">
    <input type="text" id="issueTitle" placeholder="標題">
    <textarea id="issueBody" placeholder="內容（支援 Markdown）"></textarea>
    <div class="token-row">
        <input type="password" id="tokenInput" placeholder="GitHub Token">
        <button class="submit-btn" onclick="submitIssue()">發佈</button>
    </div>
    <div class="note">🔑 需要 Token (勾選 public_repo)。<a href="https://github.com/settings/tokens/new?scopes=public_repo&description=eirin-discuss" target="_blank">點此建立</a></div>
</div>
<div id="issues-container"><div class="loading">🌸 載入中...</div></div>

<script>
    const repo = 'Kasilovsky/eirin-report';
    let token = localStorage.getItem('gh_token') || '';
    if (token) document.getElementById('tokenInput').value = token;

    document.getElementById('toggleComposeBtn').onclick = () => {
        document.getElementById('composeBox').classList.toggle('show');
    };

    async function submitIssue() {
        const title = document.getElementById('issueTitle').value.trim();
        const body = document.getElementById('issueBody').value.trim();
        token = document.getElementById('tokenInput').value.trim();
        if (!title || !body || !token) return alert('請填寫完整');
        const res = await fetch(`https://api.github.com/repos/${repo}/issues`, {
            method:'POST', headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},
            body:JSON.stringify({title,body})
        });
        if (res.ok) {
            alert('發佈成功'); localStorage.setItem('gh_token', token);
            document.getElementById('issueTitle').value=''; document.getElementById('issueBody').value='';
            loadIssues();
        } else alert('失敗: '+ (await res.json()).message);
    }

    async function loadIssues() {
        const cont = document.getElementById('issues-container');
        cont.innerHTML = '<div class="loading">載入中...</div>';
        const res = await fetch(`https://api.github.com/repos/${repo}/issues?state=all&per_page=30&sort=created&direction=desc`);
        const issues = await res.json();
        if (!issues.length) { cont.innerHTML = '<div class="loading">尚無討論</div>'; return; }
        cont.innerHTML = issues.map(issue => {
            const r = issue.reactions || {};
            return `
            <div class="issue-card">
                <div class="issue-title" onclick="toggleComments(${issue.number})">${escapeHtml(issue.title)}</div>
                <div class="issue-meta">#${issue.number} · ${issue.user.login} · ${new Date(issue.created_at).toLocaleDateString()}</div>
                <div class="reactions" id="reactions-${issue.number}">
                    <button class="reaction-btn" onclick="addReaction(${issue.number}, '+1')">👍 ${r['+1']||0}</button>
                    <button class="reaction-btn" onclick="addReaction(${issue.number}, 'heart')">❤️ ${r.heart||0}</button>
                    <button class="reaction-btn" onclick="addReaction(${issue.number}, 'tada')">🎉 ${r.tada||0}</button>
                </div>
                <div class="comments-section" id="comments-${issue.number}"></div>
            </div>`;
        }).join('');
    }

    async function addReaction(issueNumber, reaction) {
        if (!token) { alert('請先設定 Token'); return; }
        const res = await fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}/reactions`, {
            method:'POST', headers:{'Authorization':`token ${token}`, 'Accept':'application/vnd.github.squirrel-girl-preview+json'},
            body:JSON.stringify({content:reaction})
        });
        if (res.ok) { loadIssues(); } else { alert('反應失敗: '+(await res.json()).message); }
    }

    function toggleComments(num) {
        const div = document.getElementById(`comments-${num}`);
        div.classList.toggle('show');
        if (div.classList.contains('show') && !div.innerHTML) loadComments(num);
    }

    async function loadComments(issueNumber) {
        const div = document.getElementById(`comments-${issueNumber}`);
        div.innerHTML = '<div class="loading">載入回覆...</div>';
        const res = await fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}/comments`);
        const comments = await res.json();
        let html = comments.map(c => `
            <div class="comment-item">
                <div class="comment-meta">${c.user.login} · ${new Date(c.created_at).toLocaleString()}</div>
                <div>${escapeHtml(c.body)}</div>
                <div class="reactions">
                    <button class="reaction-btn" onclick="addCommentReaction(${c.id}, '+1')">👍 ${c.reactions?.['+1']||0}</button>
                    <button class="reaction-btn" onclick="addCommentReaction(${c.id}, 'heart')">❤️ ${c.reactions?.heart||0}</button>
                </div>
            </div>`).join('');
        html += `
            <div class="reply-box">
                <textarea id="reply-${issueNumber}" placeholder="回覆..."></textarea>
                <div class="reply-actions"><button onclick="submitReply(${issueNumber})">送出</button></div>
            </div>`;
        div.innerHTML = html;
    }

    async function submitReply(issueNumber) {
        if (!token) { alert('請設定 Token'); return; }
        const body = document.getElementById(`reply-${issueNumber}`).value.trim();
        if (!body) return;
        const res = await fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}/comments`, {
            method:'POST', headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},
            body:JSON.stringify({body})
        });
        if (res.ok) { loadComments(issueNumber); } else alert('失敗');
    }

    async function addCommentReaction(commentId, reaction) {
        if (!token) { alert('請設定 Token'); return; }
        await fetch(`https://api.github.com/repos/${repo}/issues/comments/${commentId}/reactions`, {
            method:'POST', headers:{'Authorization':`token ${token}`, 'Accept':'application/vnd.github.squirrel-girl-preview+json'},
            body:JSON.stringify({content:reaction})
        });
        loadIssues();
    }

    function escapeHtml(t) { return String(t).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"'); }
    loadIssues();
</script>
</body>
</html>
