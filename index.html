
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
    <title>永遠亭 医療報告 · 八意永琳</title>
    <style>
        :root {
            --bg: #ffffff; --text: #1e293b; --card-bg: #fdfdfd; --border: #cbd5e1;
            --accent: #1e3a5f; --highlight: #b91c1c; --subtle: #64748b;
            --shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        body.dark {
            --bg: #0f172a; --text: #e2e8f0; --card-bg: #1e293b; --border: #334155;
            --accent: #38bdf8; --highlight: #f87171; --subtle: #94a3b8;
            --shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', 'Noto Sans SC', 'PingFang SC', sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 16px 12px 32px; position: relative; }

        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 6px; gap: 8px; }
        .icon-btn {
            background: none; border: none; font-size: 1.2em; cursor: pointer; color: var(--subtle);
            padding: 4px 8px; border-radius: 20px;
        }
        .icon-btn:hover { background: var(--border); }

        /* 设置面板 - 从右上角滑出 */
        .settings-panel {
            position: fixed; top: 0; right: -320px; width: 280px; height: 100vh;
            background: var(--card-bg); border-left: 1px solid var(--border);
            box-shadow: -4px 0 20px rgba(0,0,0,0.2); z-index: 999;
            padding: 24px 20px; transition: right 0.3s ease;
        }
        .settings-panel.open { right: 0; }
        .settings-backdrop {
            position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3);
            z-index: 998; display: none;
        }
        .settings-backdrop.show { display: block; }
        .settings-panel h3 { margin-bottom: 16px; color: var(--accent); }
        .setting-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--border);
        }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { display: none; }
        .slider {
            position: absolute; cursor: pointer; top:0; left:0; right:0; bottom:0;
            background: #ccc; border-radius: 24px; transition: 0.3s;
        }
        .slider:before {
            position: absolute; content:""; height: 18px; width: 18px;
            left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s;
        }
        input:checked + .slider { background: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        .header { text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
        .header h1 { font-size: 1.8em; color: var(--accent); letter-spacing: 2px; margin-bottom: 4px; }
        .header .subtitle { font-size: 0.85em; color: var(--subtle); margin-bottom: 8px; }
        .date-badge { display: inline-block; background: var(--highlight); color: #fff; padding: 4px 16px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; justify-content: center; }
        .filter-btn {
            background: none; border: 1px solid var(--border); color: var(--text);
            padding: 4px 14px; border-radius: 20px; cursor: pointer; font-size: 0.8em; transition: all 0.2s;
        }
        .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .news-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
            padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow); word-break: break-word;
        }
        .news-source-tag { font-weight: 700; font-size: 0.75em; color: var(--highlight); text-transform: uppercase; }
        .news-title { font-weight: 700; font-size: 1.05em; margin: 6px 0; line-height: 1.4; }
        .news-citation { font-size: 0.8em; color: var(--subtle); margin-bottom: 6px; font-style: italic; }
        .news-summary { font-size: 0.9em; color: var(--text); opacity: 0.85; margin-bottom: 10px; }
        .news-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn-sm { background: var(--accent); color: #fff; border: none; padding: 4px 12px; border-radius: 16px; font-size: 0.75em; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .actions-bar { margin-top: 20px; text-align: center; }
        .btn { background: var(--accent); color: #fff; border: none; padding: 10px 24px; border-radius: 24px; font-size: 0.9em; cursor: pointer; }
        .resources { margin-top: 24px; padding: 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; text-align: center; }
        .resources h3 { color: var(--accent); font-size: 0.95em; margin-bottom: 10px; }
        .resource-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .resource-links a { color: var(--accent); text-decoration: none; border: 1px solid var(--border); padding: 4px 12px; border-radius: 16px; font-size: 0.8em; }
        .footer { text-align: center; margin-top: 16px; font-size: 0.7em; color: var(--subtle); }
    </style>
</head>
<body>
<div class="container">
    <!-- 顶部工具栏 -->
    <div class="top-bar">
        <button class="icon-btn" onclick="toggleTheme()" title="切换暗色模式">🌓</button>
        <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
    </div>

    <div class="header">
        <div style="font-size:2em; margin-bottom:4px;">🏹🐇</div>
        <h1>永遠亭 医療報告</h1>
        <div class="subtitle">八意永琳 · 每日權威醫學進展</div>
        <div class="date-badge" id="dateDisplay"></div>
    </div>

    <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="NEJM">NEJM</button>
        <button class="filter-btn" data-filter="PubMed">PubMed</button>
    </div>

    <div id="newsContainer"><p style="text-align:center; opacity:0.7;">🌸 讀取中...</p></div>

    <div class="actions-bar">
        <button class="btn" id="copyAllBtn">📋 複製今日速報文本</button>
    </div>

    <div class="resources">
        <h3>📚 醫學資源</h3>
        <div class="resource-links">
            <a href="https://www.nejm.org/" target="_blank">NEJM</a>
            <a href="https://www.thelancet.com/" target="_blank">Lancet</a>
            <a href="https://jamanetwork.com/" target="_blank">JAMA</a>
            <a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank">PubMed</a>
            <a href="https://www.who.int/" target="_blank">WHO</a>
        </div>
    </div>

    <div class="footer">© 永遠亭 令和時代醫療速報 · 每日自動更新</div>
</div>

<!-- 设置面板（隐藏） -->
<div class="settings-backdrop" id="settingsBackdrop"></div>
<div class="settings-panel" id="settingsPanel">
    <h3>⚙️ 顯示設定</h3>
    <div class="setting-row">
        <span>啟用漢化</span>
        <label class="switch">
            <input type="checkbox" id="translateToggle" checked>
            <span class="slider"></span>
        </label>
    </div>
    <div class="setting-row">
        <span>暗色模式</span>
        <label class="switch">
            <input type="checkbox" id="darkToggle">
            <span class="slider"></span>
        </label>
    </div>
    <button class="btn" style="width:100%; margin-top:20px;" onclick="closeSettings()">關閉</button>
</div>

<script>
    let allArticles = [];
    let currentFilter = 'all';
    let useChinese = true;   // 默认中文

    // 日期
    (function(){
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth()+1).padStart(2,'0');
        const d = String(now.getDate()).padStart(2,'0');
        document.getElementById('dateDisplay').textContent = `令和${y-2018}年（${y}）${m}月${d}日`;
    })();

    function escapeHtml(text) { return String(text).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"'); }

    function renderNews(articles) {
        const container = document.getElementById('newsContainer');
        if (!articles.length) {
            container.innerHTML = '<p style="text-align:center; opacity:0.7;">今日暫無新聞。</p>';
            return;
        }
        let html = '';
        articles.forEach((a, idx) => {
            const title = useChinese ? (a.title_zh || a.title_en) : a.title_en;
            const summary = useChinese ? (a.summary_zh || a.summary_en) : (a.summary_en || '');
            html += `
                <div class="news-card">
                    <div class="news-source-tag">■ ${escapeHtml(a.source)} · ${escapeHtml(a.category)}</div>
                    <div class="news-title">${escapeHtml(title)}</div>
                    ${a.citation ? `<div class="news-citation">${escapeHtml(a.citation)}</div>` : ''}
                    ${summary ? `<div class="news-summary">${escapeHtml(summary)}</div>` : ''}
                    <div class="news-actions">
                        ${a.link ? `<a class="btn-sm" href="${escapeHtml(a.link)}" target="_blank">📎 查看原文</a>` : ''}
                        <button class="btn-sm btn-outline" onclick="copySingle(${idx})">📋 複製引用</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function applyFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === filter);
        });
        const filtered = (filter === 'all') ? allArticles : allArticles.filter(a => a.source === filter);
        renderNews(filtered);
    }

    document.getElementById('filterBar').addEventListener('click', (e) => {
        if (e.target.classList.contains('filter-btn')) applyFilter(e.target.dataset.filter);
    });

    async function loadNews() {
        try {
            const res = await fetch('https://raw.githubusercontent.com/Kasilovsky/eirin-report/main/data/news.json');
            if (!res.ok) throw new Error('無法載入');
            const data = await res.json();
            allArticles = data.articles || [];
            applyFilter(currentFilter);
        } catch (err) {
            document.getElementById('newsContainer').innerHTML = '<p style="text-align:center; opacity:0.7;">⚠️ 無法載入新聞</p>';
        }
    }

    function copySingle(idx) {
        const a = allArticles[idx];
        if (!a) return;
        const title = useChinese ? (a.title_zh || a.title_en) : a.title_en;
        const text = `${title}\n${a.citation || ''}\n${a.link || ''}`;
        navigator.clipboard.writeText(text).then(() => alert('已複製引用')).catch(() => alert('複製失敗'));
    }

    document.getElementById('copyAllBtn').addEventListener('click', () => {
        if (!allArticles.length) return alert('暫無新聞');
        let text = `【永遠亭 医療速報】${document.getElementById('dateDisplay').textContent}\n`;
        allArticles.forEach((a, i) => {
            const title = useChinese ? (a.title_zh || a.title_en) : a.title_en;
            text += `\n${i+1}. [${a.source}] ${title}`;
            if (a.citation) text += `\n   ${a.citation}`;
            if (a.link) text += `\n   ${a.link}`;
        });
        text += '\n\n—— 八意永琳';
        navigator.clipboard.writeText(text).then(() => alert('速報文本已複製')).catch(() => alert('複製失敗'));
    });

    // ---------- 设置面板逻辑 ----------
    const settingsPanel = document.getElementById('settingsPanel');
    const settingsBackdrop = document.getElementById('settingsBackdrop');
    const translateToggle = document.getElementById('translateToggle');
    const darkToggle = document.getElementById('darkToggle');

    function openSettings() {
        settingsPanel.classList.add('open');
        settingsBackdrop.classList.add('show');
    }
    function closeSettings() {
        settingsPanel.classList.remove('open');
        settingsBackdrop.classList.remove('show');
    }
    document.getElementById('settingsBtn').addEventListener('click', openSettings);
    settingsBackdrop.addEventListener('click', closeSettings);

    // 翻译开关
    translateToggle.checked = useChinese;
    translateToggle.addEventListener('change', function() {
        useChinese = this.checked;
        applyFilter(currentFilter);
    });

    // 暗色模式开关（与之前按钮联动）
    darkToggle.checked = document.body.classList.contains('dark');
    darkToggle.addEventListener('change', function() {
        document.body.classList.toggle('dark', this.checked);
        localStorage.setItem('theme', this.checked ? 'dark' : 'light');
    });

    function toggleTheme() {
        const dark = !document.body.classList.contains('dark');
        document.body.classList.toggle('dark', dark);
        darkToggle.checked = dark;
        localStorage.setItem('theme', dark ? 'dark' : 'light');
    }
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        darkToggle.checked = true;
    }

    // 初始加载
    loadNews();
</script>
</body>
</html>
