<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
    <title>永遠亭 医療報告 · 八意永琳</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1e293b;
            --card-bg: #f8fafc;
            --border: #cbd5e1;
            --accent: #1e3a5f;      /* 深蓝 */
            --highlight: #b91c1c;  /* 红 */
            --decor: #e2e8f0;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        body.dark {
            --bg: #0f172a;
            --text: #f1f5f9;
            --card-bg: #1e293b;
            --border: #334155;
            --accent: #38bdf8;
            --highlight: #ef4444;
            --decor: #334155;
            --shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.8em;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .header .subtitle {
            font-size: 0.9em;
            color: var(--text);
            opacity: 0.8;
            margin-bottom: 8px;
        }
        .date-badge {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.85em;
        }
        .theme-switch {
            text-align: right;
            margin-bottom: 12px;
        }
        .theme-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85em;
        }
        .news-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
        }
        .news-category {
            font-weight: 700;
            font-size: 0.8em;
            color: var(--highlight);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .news-title {
            font-weight: 700;
            font-size: 1.1em;
            margin: 6px 0;
            word-break: break-word;
            line-height: 1.4;
        }
        .news-summary {
            font-size: 0.95em;
            color: var(--text);
            opacity: 0.85;
            margin-bottom: 10px;
            word-break: break-word;
        }
        .news-source {
            font-size: 0.8em;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .news-link a {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85em;
            transition: background 0.2s;
        }
        .news-link a:hover { background: var(--highlight); }
        .resources {
            margin-top: 24px;
            padding: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: center;
        }
        .resources h3 {
            color: var(--accent);
            margin-bottom: 10px;
        }
        .resource-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .resource-links a {
            color: var(--accent);
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 0.75em;
            opacity: 0.7;
        }
        .decor { font-size: 2em; text-align: center; margin-bottom: 8px; opacity: 0.6; }
    </style>
</head>
<body>
<div class="container">
    <div class="theme-switch">
        <button class="theme-btn" onclick="toggleTheme()">🌓 切换配色</button>
    </div>
    <div class="header">
        <div class="decor">🏹</div>
        <h1>永遠亭 医療報告</h1>
        <div class="subtitle">八意永琳 · 每日權威醫學進展</div>
        <div class="date-badge" id="dateDisplay"></div>
    </div>

    <div id="newsContainer">
        <p style="text-align:center; color: var(--text); opacity:0.7;">🌸 讀取最新資訊中...</p>
    </div>

    <div class="resources">
        <h3>📚 其他醫學資源</h3>
        <div class="resource-links">
            <a href="https://www.nejm.org/" target="_blank" rel="noopener">NEJM</a>
            <a href="https://www.thelancet.com/" target="_blank" rel="noopener">The Lancet</a>
            <a href="https://jamanetwork.com/" target="_blank" rel="noopener">JAMA</a>
            <a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" rel="noopener">PubMed</a>
            <a href="https://www.who.int/" target="_blank" rel="noopener">WHO</a>
        </div>
    </div>

    <div class="footer">
        令和時代の醫療速報 · 自動更新於每日上午
    </div>
</div>

<script>
    const newsContainer = document.getElementById('newsContainer');
    const dateDisplay = document.getElementById('dateDisplay');

    function escapeHtml(text) {
        return String(text).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
    }

    function renderNews(articles) {
        if (!articles || articles.length === 0) {
            newsContainer.innerHTML = '<p style="text-align:center; color: var(--text); opacity:0.7;">今日暫無新聞。</p>';
            return;
        }
        let html = '';
        articles.forEach(article => {
            html += `
                <div class="news-card">
                    <div class="news-category">■ ${escapeHtml(article.category)}</div>
                    <div class="news-title">${escapeHtml(article.title)}</div>
                    <div class="news-summary">${escapeHtml(article.summary || '')}</div>
                    <div class="news-source">📖 ${escapeHtml(article.source)}</div>
                    ${article.link ? `<div class="news-link"><a href="${escapeHtml(article.link)}" target="_blank" rel="noopener">📎 查看原文</a></div>` : ''}
                </div>
            `;
        });
        newsContainer.innerHTML = html;
    }

    async function loadNews() {
        try {
            const res = await fetch('https://raw.githubusercontent.com/Kasilovsky/eirin-report/main/data/news.json');
            if (!res.ok) throw new Error('無法載入資料');
            const data = await res.json();
            renderNews(data.articles);
        } catch (err) {
            newsContainer.innerHTML = '<p style="text-align:center; color: var(--text); opacity:0.7;">⚠️ 無法載入醫療新聞，請稍後再試。</p>';
            console.error(err);
        }
    }

    function setDate() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth()+1).padStart(2,'0');
        const d = String(now.getDate()).padStart(2,'0');
        const reiwa = y - 2018;
        dateDisplay.textContent = `令和${reiwa}年（${y}）${m}月${d}日`;
    }

    function toggleTheme() {
        document.body.classList.toggle('dark');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }

    // 读取保存的主题
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
    }

    setDate();
    loadNews();
</script>
</body>
</html>
