<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>永遠亭 医療報告 · 八意永琳</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Serif SC", "KaiTi", "STKaiti", "楷体", serif;
      background: #f5efe0;
      background-image: radial-gradient(circle at 10% 20%, rgba(180,160,120,0.15) 1px, transparent 1px);
      background-size: 40px 40px;
      color: #3e3232; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
    }
    .decor-top { position: fixed; top:0; left:0; width:100%; height:6px; background: linear-gradient(90deg,#8b5a2b,#b8860b,#8b5a2b,#6b8e23,#8b5a2b); z-index:10; }
    .bamboo-left,.bamboo-right { position:fixed; top:20px; font-size:48px; opacity:0.25; z-index:0; user-select:none; }
    .bamboo-left { left:10px; } .bamboo-right { right:10px; }
    .rabbit-moon { position:fixed; bottom:30px; right:30px; font-size:40px; opacity:0.35; z-index:0; }
    .main-container {
      width:100%; max-width:950px; background:rgba(255,251,245,0.85); backdrop-filter:blur(6px);
      border:2px solid #b89b7b; border-radius:24px; box-shadow:0 12px 32px rgba(60,40,20,0.25);
      padding:28px 32px; position:relative; z-index:1; margin-bottom:30px;
    }
    h1 { text-align:center; font-size:2.6em; letter-spacing:6px; color:#4a3620; margin-bottom:4px; font-weight:500; }
    .subtitle { text-align:center; font-size:1.1em; color:#6f4e37; border-bottom:2px dashed #b89b7b; padding-bottom:10px; margin-bottom:24px; font-style:italic; letter-spacing:2px; }
    .date-display { text-align:right; font-size:1em; color:#5a4a3a; margin-bottom:18px; }
    .report-preview { background:#fcf9f2; border:1px solid #dac29c; border-radius:20px; padding:28px 26px; margin-top:20px; box-shadow:inset 0 0 20px rgba(180,140,80,0.15); }
    .report-header { text-align:center; margin-bottom:18px; }
    .report-header h2 { font-size:2.2em; letter-spacing:5px; color:#3f2e1c; }
    .eirin-mark { font-size:1.8em; color:#b5926c; }
    .report-date { font-size:1.05em; color:#5e4e3c; margin:6px 0 16px; }
    .news-item { margin-bottom:18px; border-left:6px solid #b5926c; padding-left:16px; }
    .news-category { font-weight:bold; color:#7a5c3a; font-size:1.15em; margin-bottom:3px; }
    .news-title { font-size:1.1em; font-weight:600; color:#2f2418; margin-bottom:4px; }
    .news-content { color:#3f362c; margin-bottom:4px; line-height:1.5; }
    .news-source { font-size:0.85em; color:#8b735b; font-style:italic; }
    .divider { border:none; border-top:1px dashed #ccb690; margin:18px 0 10px; }
    .report-footer { margin-top:14px; font-size:0.8em; color:#897b6b; text-align:right; font-style:italic; }
    .btn { background:#8b6b4b; border:none; color:#fef7e9; padding:10px 22px; border-radius:30px; font-size:1em; cursor:pointer; margin-top:12px; }
  </style>
</head>
<body>
<div class="decor-top"></div>
<div class="bamboo-left">🎋</div>
<div class="bamboo-right">🎋</div>
<div class="rabbit-moon">🐇🌙</div>

<div class="main-container">
  <h1>永遠亭</h1>
  <div class="subtitle">⛩️ 八意永琳 · 医療速報 ⛩️</div>
  <div class="date-display" id="currentDate"></div>
  <div class="report-preview" id="reportPreview">
    <div style="text-align:center; color:#ab9a84;">🌸 讀取最新医療速報中... 🌸</div>
  </div>
  <div style="text-align:right;">
    <button class="btn" onclick="loadReport()">🔄 重新整理</button>
  </div>
</div>
<script>
  // 日期
  const now = new Date();
  document.getElementById('currentDate').textContent = `📅 令和${now.getFullYear()-2018}年（${now.getFullYear()}）${String(now.getMonth()+1).padStart(2,'0')}月${String(now.getDate()).padStart(2,'0')}日`;
  function escapeHtml(text) { return String(text).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"'); }
  function generateReportHTML(articles) {
    const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
    let items = '';
    if (!articles || articles.length===0) {
      items = '<p style="text-align:center; color:#978a7a;">今日暫無新聞。</p>';
    } else {
      articles.forEach(a => {
        let cleanContent = a.summary.replace(/<[^>]+>/g, '');
        items += `<div class="news-item"><div class="news-category">■ ${escapeHtml(a.category)}</div><div class="news-title">${escapeHtml(a.title)}</div><div class="news-content">${escapeHtml(cleanContent)}</div><div class="news-source">📖 ${escapeHtml(a.source)}</div></div>`;
      });
    }
    return `<div class="report-header"><div class="eirin-mark">🏹🐇</div><h2>永遠亭 医療報告</h2><div class="report-date">令和${y-2018}年（${y}）${m}月${d}日　報告人：八意永琳</div></div><hr class="divider">${items}<hr class="divider"><div class="report-footer">※ 本報告自動生成，每日更新。</div>`;
  }
  async function loadReport() {
    const preview = document.getElementById('reportPreview');
    preview.innerHTML = '<div style="text-align:center; color:#ab9a84;">🌸 讀取中...</div>';
    try {
      // 重要：这里的 URL 必须指向你仓库的 news.json 原始文件
      const res = await fetch('https://raw.githubusercontent.com/Kasilovsky/eirin-report/main/data/news.json');
      if (!res.ok) throw new Error('文件不存在');
      const data = await res.json();
      preview.innerHTML = generateReportHTML(data.articles);
    } catch (e) {
      preview.innerHTML = generateReportHTML([]);
      console.error('加載新聞失敗:', e);
    }
  }
  window.addEventListener('DOMContentLoaded', loadReport);
</script>
</body>
</html>
